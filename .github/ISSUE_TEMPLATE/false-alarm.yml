name: Wrong finding
description: A check flagged something that isn't a problem, or missed one that is.
labels: [rules]
body:
  - type: input
    id: rule
    attributes: { label: Rule id, description: "For example auth.no-rate-limit" }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes: { label: Kind, options: ["False alarm", "Missed problem"] }
    validations: { required: true }
  - type: textarea
    id: code
    attributes: { label: Smallest code that shows it, description: "A few lines are enough. Don't paste private code or secrets.", render: text }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it's wrong }
