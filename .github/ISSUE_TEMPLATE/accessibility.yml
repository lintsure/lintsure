name: Accessibility barrier
description: Something in the CLI, reports or docs is hard to use with your setup.
labels: [accessibility]
body:
  - type: textarea
    id: what
    attributes: { label: What you were trying to do }
    validations: { required: true }
  - type: textarea
    id: barrier
    attributes: { label: What got in the way }
    validations: { required: true }
  - type: input
    id: tools
    attributes: { label: Tools you use, description: "Screen reader, terminal, editor, browser" }
