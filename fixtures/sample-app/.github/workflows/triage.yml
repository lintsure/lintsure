# Planted examples: a token with write access to everything, and issue text pasted into a shell command.
on: issues
permissions: write-all
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - run: echo "New issue ${{ github.event.issue.title }}"
      - run: |
          echo "checking"
          ./label.sh "${{ github.event.issue.body }}"
